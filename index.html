<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matter Onboarding Station</title>
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #f4f6f9;
            margin: 0;
            padding: 40px;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: inline-block;
            max-width: 400px;
        }
        h2 { color: #2c3e50; margin-bottom: 5px; }
        .meta-text { font-size: 14px; color: #7f8c8d; margin-bottom: 20px; }
        #qrcode {
            margin: 20px auto;
            padding: 15px;
            background: white;
            display: inline-block;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            min-width: 250px;
            min-height: 250px;
        }
        .info-box {
            background-color: #ecf0f1;
            padding: 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 15px;
            color: #2c3e50;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Open Sesame</h2>
    <div class="meta-text">Ecosystem Onboarding Dashboard</div>
    
    <div id="qrcode"></div>
    
    <div class="info-box">
        <strong>Discriminator:</strong> <span id="lbl-disc">--</span><br>
        <strong>Setup Passcode:</strong> <span id="lbl-pin">--</span>
    </div>
</div>

<script>
    function generateMatterQrPayload(discriminator, passcode, vid=0xFFF1, pid=0x8000) {
        try {
            // 1. Bit-pack parameters into BigInt slots safely
            let bitPayload = BigInt(0);
            bitPayload |= BigInt(0 & 0x07);              
            bitPayload |= BigInt(vid & 0xFFFF) << 3n;     
            bitPayload |= BigInt(pid & 0xFFFF) << 19n;    
            bitPayload |= BigInt(0 & 0x03) << 35n;        
            bitPayload |= BigInt(4 & 0xFF) << 37n;        
            bitPayload |= BigInt(discriminator & 0xFFF) << 45n; 
            bitPayload |= BigInt(passcode & 0x7FFFFFF) << 57n;  

            // 2. Unpack into 11 distinct raw data bytes
            let rawBytes = [];
            let tempPayload = bitPayload;
            for (let i = 0; i < 11; i++) {
                rawBytes.push(Number(tempPayload & 0xFFn));
                tempPayload >>= 8n;
            }

            // 3. Translate binary blocks directly to Base38 symbol text maps
            const BASE38_CHARS = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ-.";
            let base38EncodedString = "";
            let byteIndex = 0;

            while (byteIndex < rawBytes.length) {
                let remainingBytes = rawBytes.length - byteIndex;
                let chunkValue = 0;
                let charCount = 0;

                if (remainingBytes >= 3) {
                    chunkValue = rawBytes[byteIndex] | (rawBytes[byteIndex+1] << 8) | (rawBytes[byteIndex+2] << 16);
                    charCount = 5;
                    byteIndex += 3;
                } else {
                    chunkValue = rawBytes[byteIndex] | (rawBytes[byteIndex+1] << 8);
                    charCount = 4;
                    byteIndex += 2;
                }

                for (let c = 0; c < charCount; c++) {
                    base38EncodedString += BASE38_CHARS[chunkValue % 38];
                    chunkValue = Math.floor(chunkValue / 38);
                }
            }

            return "MT:" + base38EncodedString;
        } catch (err) {
            console.error("Calculation Error:", err);
            return "MT:INVALIDMATH";
        }
    }

    // Capture execution parameters straight from the browser URL address bar
    const urlParams = new URLSearchParams(window.location.search);
    const discriminator = parseInt(urlParams.get('disc')) || 1000;
    const passcode = parseInt(urlParams.get('pin')) || 10000000;

    document.getElementById('lbl-disc').innerText = discriminator;
    document.getElementById('lbl-pin').innerText = passcode;

    // Run the live Base38 mathematical encoding conversion engine
    const liveMatterPayload = generateMatterQrPayload(discriminator, passcode);
    console.log("Generated Payload: ", liveMatterPayload);

    // SAFETY CHECK: Wait for DOM element and payload verification before mounting graphic
    window.addEventListener('DOMContentLoaded', (event) => {
        const qrContainer = document.getElementById("qrcode");
        qrContainer.innerHTML = ""; // Clear loader artifacts
        
        new QRCode(qrContainer, {
            text: liveMatterPayload,
            width: 250,
            height: 250,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });
    });
</script>

</body>
</html>
