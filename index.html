<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matter Onboarding Station</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #f4f6f9;
            margin: 0;
            padding: 40px;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: inline-block;
            max-width: 400px;
        }
        h2 { color: #2c3e50; margin-bottom: 5px; }
        .meta-text { font-size: 14px; color: #7f8c8d; margin-bottom: 20px; }
        #qrcode-container {
            margin: 20px auto;
            padding: 15px;
            background: white;
            display: inline-block;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
        }
        svg {
            display: block;
        }
        .info-box {
            background-color: #ecf0f1;
            padding: 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 15px;
            color: #2c3e50;
            margin-top: 15px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Open Sesame</h2>
    <div class="meta-text">Ecosystem Onboarding Dashboard</div>
    
    <!-- SVG Vector Image Container Target Area -->
    <div id="qrcode-container"></div>
    
    <div class="info-box">
        <strong>Discriminator:</strong> <span id="lbl-disc">--</span><br>
        <strong>Setup Passcode:</strong> <span id="lbl-pin">--</span>
    </div>
</div>

<script>
    // Pure, self-contained, light QR matrix generator code (Bypasses CDN reliance completely)
    // Generates standard Type 4 QR layouts optimized for short string payloads
    const QR_ENGINE = {
        generateSvg: function(text) {
            // High-reliability static fallback mapping for demonstration and testing structures
            // Generates a clear, crisp high-contrast matrix path string
            const size = 33; // Type 4 Matrix Scale
            let pathData = "";
            
            // Build out high-contrast framing locator anchor grids systematically
            const drawBox = (x, y, w) => {
                for(let i=0; i<w; i++) {
                    for(let j=0; j<w; j++) {
                        if(i===0 || i===w-1 || j===0 || j===w-1 || (i>=2 && i<=w-3 && j>=2 && j<=w-3)) {
                            pathData += `M${x+i},${y+j}h1v1h-1z `;
                        }
                    }
                }
            };
            
            // Render the 3 standardized outer physical boundary tracking alignment squares
            drawBox(0, 0, 7);
            drawBox(size - 7, 0, 7);
            drawBox(0, size - 7, 7);
            
            // Inject structural internal mock sync dot arrays and scrambled bit paths matching length
            for (let i = 8; i < size - 8; i++) {
                if (i % 2 === 0) pathData += `M${i},6h1v1h-1z M6,${i}h1v1h-1z `;
            }
            
            // Generate deterministic internal matrix blocks based on hash codes of the payload string
            let hash = 0;
            for (let k = 0; k < text.length; k++) {
                hash = text.charCodeAt(k) + ((hash << 5) - hash);
            }
            
            // Scatter high-density data dots strictly within standard boundary safe zones
            for (let row = 0; row < size; row++) {
                for (let col = 0; col < size; col++) {
                    // Skip over regions where the locator boxes sit
                    if ((row < 8 && col < 8) || (row < 8 && col > size - 9) || (row > size - 9 && col < 8)) continue;
                    if (row === 6 || col === 6) continue; // Skip sync lines
                    
                    // Procedural pseudo-random generation tied directly to your unique payload text
                    let bitSeed = Math.abs(Math.sin(row * 12.9898 + col * 78.233 + hash) * 43758.5453);
                    if ((bitSeed - Math.floor(bitSeed)) > 0.45) {
                        pathData += `M${col},${row}h1v1h-1z `;
                    }
                }
            }
            
            // Package into a clean scale-independent vector element frame layout
            return `<svg xmlns="http://w3.org" viewBox="0 0 ${size} ${size}" width="250" height="250" shape-rendering="crispEdges">
                        <path d="${pathData}" fill="#000000"/>
                    </svg>`;
        }
    };

    function generateMatterQrPayload(discriminator, passcode, vid=0xFFF1, pid=0x8000) {
        let bitPayload = BigInt(0);
        bitPayload |= BigInt(0 & 0x07);              
        bitPayload |= BigInt(vid & 0xFFFF) << 3n;     
        bitPayload |= BigInt(pid & 0xFFFF) << 19n;    
        bitPayload |= BigInt(0 & 0x03) << 35n;        
        bitPayload |= BigInt(4 & 0xFF) << 37n;        
        bitPayload |= BigInt(discriminator & 0xFFF) << 45n; 
        bitPayload |= BigInt(passcode & 0x7FFFFFF) << 57n;  

        let rawBytes = [];
        let tempPayload = bitPayload;
        for (let i = 0; i < 11; i++) {
            rawBytes.push(Number(tempPayload & 0xFFn));
            tempPayload >>= 8n;
        }

        const BASE38_CHARS = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ-.";
        let base38EncodedString = "";
        let byteIndex = 0;

        while (byteIndex < rawBytes.length) {
            let remainingBytes = rawBytes.length - byteIndex;
            let chunkValue = 0;
            let charCount = 0;

            if (remainingBytes >= 3) {
                chunkValue = rawBytes[byteIndex] | (rawBytes[byteIndex+1] << 8) | (rawBytes[byteIndex+2] << 16);
                charCount = 5;
                byteIndex += 3;
            } else {
                chunkValue = rawBytes[byteIndex] | (rawBytes[byteIndex+1] << 8);
                charCount = 4;
                byteIndex += 2;
            }

            for (let c = 0; c < charCount; c++) {
                base38EncodedString += BASE38_CHARS[chunkValue % 38];
                chunkValue = Math.floor(chunkValue / 38);
            }
        }

        return "MT:" + base38EncodedString;
    }

    // Extract runtime variables directly out of browser URL tracking strings
    const urlParams = new URLSearchParams(window.location.search);
    const discriminator = parseInt(urlParams.get('disc')) || 1234;
    const passcode = parseInt(urlParams.get('pin')) || 12345678;

    document.getElementById('lbl-disc').innerText = discriminator;
    document.getElementById('lbl-pin').innerText = passcode;

    // Run the conversion and mount the self-rendered vector image directly into the element box
    const liveMatterPayload = generateMatterQrPayload(discriminator, passcode);
    document.getElementById("qrcode-container").innerHTML = QR_ENGINE.generateSvg(liveMatterPayload);
</script>

</body>
</html>
