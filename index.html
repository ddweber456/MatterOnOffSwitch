<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matter Onboarding Station</title>
<!--
  Real, standards-compliant QR rendering via a small, widely-used library
  (davidshimjs/qrcodejs). The previous version of this page drew a
  QR-code-*shaped* SVG whose data cells were generated from a hashed noise
  pattern (Math.sin() seeded by the payload string) rather than an actual
  encoded payload - it looked plausible on screen but no phone could ever
  scan it. A hand-rolled QR encoder (Reed-Solomon error correction, version
  selection, masking) is a lot of surface area to get subtly wrong, so this
  swaps in a small trusted library instead of trying to hand-roll one.
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        text-align: center;
        background-color: #f4f6f9;
        margin: 0;
        padding: 40px;
    }
    .container {
        background-color: #ffffff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        display: inline-block;
        max-width: 400px;
    }
    h2 { color: #2c3e50; margin-bottom: 5px; }
    .meta-text { font-size: 14px; color: #7f8c8d; margin-bottom: 20px; }
    #qrcode-container {
        margin: 20px auto;
        padding: 15px;
        background: white;
        display: inline-block;
        border: 2px solid #bdc3c7;
        border-radius: 8px;
    }
    .info-box {
        background-color: #ecf0f1;
        padding: 12px;
        border-radius: 6px;
        font-family: monospace;
        font-size: 15px;
        color: #2c3e50;
        margin-top: 15px;
        line-height: 1.5;
    }
    .warning-box {
        background-color: #fdecea;
        color: #a12622;
        border: 1px solid #f5b7b1;
        padding: 10px;
        border-radius: 6px;
        font-size: 13px;
        margin-top: 15px;
        display: none;
    }
</style>
</head>
<body>

<div class="container">
    <h2>Open Sesame</h2>
    <div class="meta-text">Ecosystem Onboarding Dashboard</div>

    <div id="qrcode-container"></div>

    <div class="info-box">
        <strong>Discriminator:</strong> <span id="lbl-disc">--</span><br>
        <strong>Setup Passcode:</strong> <span id="lbl-pin">--</span>
    </div>

    <div class="warning-box" id="warning-box">
        No discriminator/passcode found in the URL - showing placeholder values.
        Use the link printed by flash_device.bat for a real device.
    </div>
</div>

<script>
// Builds the standard 88-bit Matter onboarding payload (Version 3b, VID 16b, PID 16b,
// Commissioning Flow 2b, Discovery Capabilities 8b, Discriminator 12b, Passcode 27b,
// Padding 4b), Base38-encodes it, and hands the resulting "MT:..." string to a real
// QR encoder. This mirrors print_label.py's generate_matter_qr_payload() exactly, so
// the on-screen code and the printed label encode identical payloads for the same
// discriminator/passcode.
function generateMatterQrPayload(discriminator, passcode, vid = 0xFFF1, pid = 0x8000) {
    let bitPayload = BigInt(0);
    bitPayload |= BigInt(0 & 0x07);
    bitPayload |= BigInt(vid & 0xFFFF) << 3n;
    bitPayload |= BigInt(pid & 0xFFFF) << 19n;
    bitPayload |= BigInt(0 & 0x03) << 35n;
    bitPayload |= BigInt(4 & 0xFF) << 37n;
    bitPayload |= BigInt(discriminator & 0xFFF) << 45n;
    bitPayload |= BigInt(passcode & 0x7FFFFFF) << 57n;

    let rawBytes = [];
    let tempPayload = bitPayload;
    for (let i = 0; i < 11; i++) {
        rawBytes.push(Number(tempPayload & 0xFFn));
        tempPayload >>= 8n;
    }

    const BASE38_CHARS = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ-.";
    let base38EncodedString = "";
    let byteIndex = 0;
    while (byteIndex < rawBytes.length) {
        let remainingBytes = rawBytes.length - byteIndex;
        let chunkValue = 0;
        let charCount = 0;
        if (remainingBytes >= 3) {
            chunkValue = rawBytes[byteIndex] | (rawBytes[byteIndex + 1] << 8) | (rawBytes[byteIndex + 2] << 16);
            charCount = 5;
            byteIndex += 3;
        } else {
            chunkValue = rawBytes[byteIndex] | (rawBytes[byteIndex + 1] << 8);
            charCount = 4;
            byteIndex += 2;
        }
        for (let c = 0; c < charCount; c++) {
            base38EncodedString += BASE38_CHARS[chunkValue % 38];
            chunkValue = Math.floor(chunkValue / 38);
        }
    }
    return "MT:" + base38EncodedString;
}

const urlParams = new URLSearchParams(window.location.search);
const hasParams = urlParams.has('disc') && urlParams.has('pin');
const discriminator = parseInt(urlParams.get('disc')) || 1234;
const passcode = parseInt(urlParams.get('pin')) || 12345678;

if (!hasParams) {
    document.getElementById('warning-box').style.display = 'block';
}

document.getElementById('lbl-disc').innerText = discriminator;
document.getElementById('lbl-pin').innerText = passcode;

const liveMatterPayload = generateMatterQrPayload(discriminator, passcode);

new QRCode(document.getElementById("qrcode-container"), {
    text: liveMatterPayload,
    width: 250,
    height: 250,
    colorDark: "#000000",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.M
});
</script>

</body>
</html>
